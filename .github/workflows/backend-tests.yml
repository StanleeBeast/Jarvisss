name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run worker tests
        working-directory: backend
        run: npm test

  test-home-station:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Home-Station dependencies
        working-directory: homestation
        run: npm ci --no-audit --no-fund
      - name: Run Home-Station tests
        working-directory: homestation
        run: npm test
      - name: Bundled jarvis-station.cjs matches the source
        working-directory: homestation
        run: |
          npm run build
          git diff --exit-code -- jarvis-station.cjs || (echo "jarvis-station.cjs ist veraltet: im Ordner homestation 'npm run build' ausführen und committen." && exit 1)
