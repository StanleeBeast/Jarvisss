name: Deploy JARVIS AI worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run worker tests before deploying
        working-directory: backend
        run: npm test
      - name: Attach D1 database (optional, from repository variable D1_DATABASE_ID)
        if: ${{ vars.D1_DATABASE_ID != '' }}
        working-directory: backend
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'jarvisss-db' }}
        run: |
          set -eu
          echo "$D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F-]{32,36}$' || (echo "D1_DATABASE_ID has an unexpected format"; exit 1)
          echo "$D1_DATABASE_NAME" | grep -Eq '^[A-Za-z0-9_-]{1,64}$' || (echo "D1_DATABASE_NAME has an unexpected format"; exit 1)
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "%s"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$D1_DATABASE_NAME" "$D1_DATABASE_ID" >> wrangler.toml
          echo "D1 binding DB -> $D1_DATABASE_NAME added for this deployment."
      - name: Apply D1 migrations
        if: ${{ vars.D1_DATABASE_ID != '' }}
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'jarvisss-db' }}
        run: npx --yes wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.toml
      - name: Deploy Cloudflare Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JARVIS_ACCESS_TOKEN: ${{ secrets.JARVIS_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GITHUB_TOKEN_JARVIS: ${{ secrets.JARVIS_GITHUB_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing GitHub secret OPENAI_API_KEY"; exit 1)
          test -n "$JARVIS_ACCESS_TOKEN" || (echo "Missing GitHub secret JARVIS_ACCESS_TOKEN"; exit 1)
          npx --yes wrangler deploy --config wrangler.toml
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler secret put OPENAI_API_KEY --config wrangler.toml
          printf '%s' "$JARVIS_ACCESS_TOKEN" | npx --yes wrangler secret put JARVIS_ACCESS_TOKEN --config wrangler.toml
          # Optional: ElevenLabs-Stimme. Ohne Secret bleibt die OpenAI-Stimme aktiv.
          if [ -n "${ELEVENLABS_API_KEY:-}" ]; then
            printf '%s' "$ELEVENLABS_API_KEY" | npx --yes wrangler secret put ELEVENLABS_API_KEY --config wrangler.toml
          else
            echo "ELEVENLABS_API_KEY nicht gesetzt – OpenAI-Stimme bleibt aktiv."
          fi
          # Optional: Selbstverbesserung (fein eingeschränkter GitHub-Token nur für dieses Repository).
          if [ -n "${GITHUB_TOKEN_JARVIS:-}" ]; then
            printf '%s' "$GITHUB_TOKEN_JARVIS" | npx --yes wrangler secret put GITHUB_TOKEN_JARVIS --config wrangler.toml
          fi
          if [ -n "${ELEVENLABS_VOICE_ID:-}" ]; then
            printf '%s' "$ELEVENLABS_VOICE_ID" | npx --yes wrangler secret put ELEVENLABS_VOICE_ID --config wrangler.toml
          fi
