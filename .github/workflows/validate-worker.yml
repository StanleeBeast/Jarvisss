name: Validate JARVIS worker

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < backend/worker.js
      - name: Verify task migration exists
        run: test -s backend/migrations/0001_tasks.sql
      - name: Verify tasks API and migration references
        run: |
          grep -q 'handleTasksApi' backend/worker.js
          grep -q 'binding = "DB"' backend/wrangler.toml || echo "D1 binding intentionally not configured yet; API will return storage_not_configured."
